<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager Debug</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>File Manager Debug</h2>
        
        <div class="mb-3">
            <label for="userIdInput" class="form-label">User ID:</label>
            <input type="text" class="form-control" id="userIdInput" value="15575ae1-2050-4cf7-b4e9-7e307c53d67d">
            <button class="btn btn-primary mt-2" onclick="testFileManager()">Test File Manager</button>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <h4>File Access Permissions</h4>
                <div id="permissions-result" class="alert alert-info">Click "Test File Manager" to check permissions</div>
            </div>
            <div class="col-md-6">
                <h4>File List</h4>
                <div id="files-result" class="alert alert-info">Click "Test File Manager" to load files</div>
            </div>
        </div>
        
        <div class="mt-4">
            <h4>Console Log</h4>
            <div id="console-log" class="bg-dark text-light p-3" style="height: 200px; overflow-y: auto; font-family: monospace;"></div>
        </div>
    </div>

    <script>
        function log(message) {
            const consoleDiv = document.getElementById('console-log');
            const timestamp = new Date().toLocaleTimeString();
            consoleDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }

        async function testFileManager() {
            const userId = document.getElementById('userIdInput').value;
            log(`Testing file manager for user: ${userId}`);
            
            try {
                // Test permissions
                log('Checking permissions...');
                const permissionsResponse = await fetch(`/get_file_access/${userId}`);
                const permissionsData = await permissionsResponse.json();
                log(`Permissions response: ${JSON.stringify(permissionsData)}`);
                
                document.getElementById('permissions-result').innerHTML = `
                    <div class="alert alert-${permissionsData.read ? 'success' : 'danger'}">
                        Read: ${permissionsData.read ? '✅' : '❌'}<br>
                        Write: ${permissionsData.write ? '✅' : '❌'}
                    </div>
                `;
                
                // Test file listing
                log('Loading files...');
                const filesResponse = await fetch(`/list_shared_files/${userId}`);
                const filesData = await filesResponse.json();
                log(`Files response: ${JSON.stringify(filesData)}`);
                
                if (filesData.files && filesData.files.length > 0) {
                    let filesHtml = '<div class="alert alert-success">';
                    filesData.files.forEach(file => {
                        filesHtml += `<div>📄 ${file.name} (${file.size} bytes)</div>`;
                    });
                    filesHtml += '</div>';
                    document.getElementById('files-result').innerHTML = filesHtml;
                } else {
                    document.getElementById('files-result').innerHTML = '<div class="alert alert-warning">No files found</div>';
                }
                
                log('File manager test completed successfully!');
                
            } catch (error) {
                log(`Error: ${error.message}`);
                document.getElementById('permissions-result').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
                document.getElementById('files-result').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }
        
        // Auto-test on page load
        document.addEventListener('DOMContentLoaded', function() {
            log('Debug page loaded');
        });
    </script>
</body>
</html>
